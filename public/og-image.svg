<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Linear Gradients for Saharan Sunset -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120703" />
      <stop offset="25%" stop-color="#2A0E05" />
      <stop offset="50%" stop-color="#5C1F08" />
      <stop offset="75%" stop-color="#9C3408" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Radial Sunset Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#F59E0B" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#120703" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C0D05" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0E0603" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="630" fill="url(#skyGrad)" />

  <!-- Sun Glow -->
  <circle cx="600" cy="220" r="300" fill="url(#sunGlow)" />
  <circle cx="600" cy="220" r="95" fill="#FEF3C7" opacity="0.9" filter="drop-shadow(0 0 45px #F59E0B)" />

  <!-- Desert Dunes Silhouette Background -->
  <path d="M 0,630 L 0,430 Q 180,360 360,410 Q 540,460 720,380 Q 900,310 1080,390 L 1200,420 L 1200,630 Z" fill="#2E1106" opacity="0.85" />
  
  <!-- Desert Dunes Midground with Traditional Domes -->
  <path d="M 0,630 L 0,480 Q 220,410 440,470 Q 660,530 880,450 Q 1050,390 1200,460 L 1200,630 Z" fill="#1C0A04" />

  <!-- Silhouette of El Oued Domes (مدينة الألف قبة) -->
  <path d="M 280,465 A 35,35 0 0 1 350,465 Z M 350,472 A 25,25 0 0 1 400,472 Z M 820,450 A 40,40 0 0 1 900,450 Z M 900,455 A 28,28 0 0 1 956,455 Z" fill="#120602" opacity="0.95" />

  <!-- Silhouette of Palm Trees -->
  <!-- Left Palm -->
  <path d="M 120,630 Q 125,520 135,420" stroke="#100502" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M 135,420 Q 90,390 40,410 Q 90,425 135,430" fill="#100502" />
  <path d="M 135,420 Q 80,360 65,330 Q 110,380 135,420" fill="#100502" />
  <path d="M 135,420 Q 135,340 145,310 Q 155,365 135,420" fill="#100502" />
  <path d="M 135,420 Q 190,360 215,340 Q 175,390 135,420" fill="#100502" />
  <path d="M 135,420 Q 200,400 230,420 Q 175,425 135,420" fill="#100502" />

  <!-- Right Palm -->
  <path d="M 1080,630 Q 1070,530 1060,430" stroke="#100502" stroke-width="9" stroke-linecap="round" fill="none" />
  <path d="M 1060,430 Q 1010,400 970,420 Q 1015,430 1060,435" fill="#100502" />
  <path d="M 1060,430 Q 1020,365 1000,340 Q 1040,390 1060,430" fill="#100502" />
  <path d="M 1060,430 Q 1065,350 1070,320 Q 1080,375 1060,430" fill="#100502" />
  <path d="M 1060,430 Q 1110,370 1140,350 Q 1100,400 1060,430" fill="#100502" />
  <path d="M 1060,430 Q 1120,410 1150,430 Q 1100,435 1060,430" fill="#100502" />

  <!-- Bottom Dark Fade Ground -->
  <rect y="520" width="1200" height="110" fill="#0C0502" />

  <!-- Central Glass Banner Container -->
  <rect x="180" y="80" width="840" height="370" rx="28" fill="url(#glassCard)" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Outer Ambient Gold Border Accent -->
  <rect x="184" y="84" width="832" height="362" rx="24" fill="none" stroke="#FDE68A" stroke-width="1" stroke-opacity="0.2" />

  <!-- Top Badge: Official Portal -->
  <g transform="translate(600, 135)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#2A1206" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="-160" cy="0" r="5" fill="#10B981" />
    <text x="5" y="6" font-family="'Alexandria', 'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="700" fill="#FDE68A" text-anchor="middle">
      البوابة الرقمية الموحدة لولاية الوادي
    </text>
  </g>

  <!-- Big Brand Title "وادنا" -->
  <text x="600" y="245" font-family="'Alexandria', 'Amiri', 'Cairo', 'Traditional Arabic', sans-serif" font-size="92" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">
    وادنـــا
  </text>

  <!-- Subtitle -->
  <text x="600" y="300" font-family="'Alexandria', 'Cairo', 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    المنصة الذكية لخدمات وتجارة وسياحة وادي سوف
  </text>

  <!-- Sub-Portals Tags -->
  <g transform="translate(600, 360)">
    <!-- Souq El Oued Badge -->
    <g transform="translate(-185, 0)">
      <rect x="-140" y="-18" width="280" height="36" rx="12" fill="#3D1A06" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Alexandria', 'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="middle">
        🛍️ سوق الوادي • souq
      </text>
    </g>

    <!-- Tourism Badge -->
    <g transform="translate(185, 0)">
      <rect x="-140" y="-18" width="280" height="36" rx="12" fill="#3D1405" stroke="#FB923C" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Alexandria', 'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FED7AA" text-anchor="middle">
        🏜️ سياحة وادنا • ouedna
      </text>
    </g>
  </g>

  <!-- Clean Bottom Domain Banner -->
  <g transform="translate(600, 412)">
    <text x="0" y="0" font-family="'Consolas', 'Courier New', monospace" font-size="20" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="3">
      myeloued.com
    </text>
  </g>

  <!-- Corner Aesthetic Accents -->
  <circle cx="205" cy="105" r="4" fill="#F59E0B" opacity="0.6" />
  <circle cx="995" cy="105" r="4" fill="#F59E0B" opacity="0.6" />
  <circle cx="205" cy="425" r="4" fill="#F59E0B" opacity="0.6" />
  <circle cx="995" cy="425" r="4" fill="#F59E0B" opacity="0.6" />
</svg>
